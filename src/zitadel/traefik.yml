# Routes the single public Zitadel origin (http://localhost:8080) to the API and the Login V2 UI.
# Mirrors the routing of Zitadel's official compose deployment (deploy/compose in the zitadel repo).
http:
  routers:
    login-root:
      rule: "Path(`/`)"
      priority: 400
      middlewares: [login-root-rewrite]
      service: zitadel-login
    login:
      rule: "PathPrefix(`/ui/v2/login`)"
      priority: 250
      service: zitadel-login
    api:
      rule: "PathPrefix(`/`)"
      priority: 100
      service: zitadel-api

  middlewares:
    login-root-rewrite:
      replacePath:
        path: /ui/v2/login/

  services:
    zitadel-login:
      loadBalancer:
        servers:
          - url: "http://zitadel-login:3000"
    zitadel-api:
      loadBalancer:
        servers:
          # h2c keeps gRPC (used by the console) working through the proxy
          - url: "h2c://zitadel:8080"
